[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acl-verbatim"
version = "0.0.1"
description = "Tools for deploying and evaluating verbatim-rag with papers from the ACL Anthology"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Gabor Recski", email = "recski@krlabs.eu"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Core ML/AI dependencies
    "verbatim-rag>=0.1.9",

    # Vector storage and search
    "pymilvus>=2.6.3",
    "pymilvus[milvus_lite]",

    # Utilities
    "tqdm>=4.65.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
hf = [
    "datasets>=2.14.0",
    "huggingface_hub>=0.20.0",
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "accelerate>=0.24.0",
]
training = [
    "datasets>=2.14.0",
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "peft>=0.7.0",
    "accelerate>=0.24.0",
]
papermeta = [
    "docopt>=0.6.2",
    "filetype>=1.2.0",
    "gitpython>=3.1.46",
    "iso-639==0.4.4",
    "jsonschema>=4.26.0",
    "lxml>=6.1.0",
    "msgspec>=0.20.0",
    "nltk>=3.9.2",
    "pre-commit>=4.5.1",
    "pybtex>=0.26.1",
    "pygithub>=2.8.1",
    "pypdf2>=3.0.1",
    "pytest>=9.0.2",
    "rich>=14.3.2",
    "texsoup~=0.3.1",
    "python-slugify>=8.0.4",
    "citeproc-py>=0.9.3",
    "langcodes>=3.5.1",
    "language_data>=1.4.0"
]
exit = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "peft>=0.7.0",
    "accelerate>=0.24.0",
]


[project.urls]
"Homepage" = "https://github.com/krlabsorg/acl-verbatim"
"Bug Tracker" = "https://github.com/krlabsorg/acl-verbatim/issues"


[tool.hatch.build.targets.wheel]
packages = ["acl_verbatim"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
    "acl_md",
    "runs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["acl_verbatim"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '''
(
  /acl_md/
| /runs/
)
'''
